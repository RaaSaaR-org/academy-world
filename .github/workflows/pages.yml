# Builds the game and publishes it on GitHub Pages: https://raasaar-org.github.io/academy-world/
# Repository settings → Pages → Build and deployment → Source: „GitHub Actions“.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push waits for the running one instead of cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build for the sub-path /academy-world/
        run: npm run build
        env:
          BASE_PATH: /academy-world/
          # GitHub Pages compresses on the fly and never serves the build's own .br / .gz files
          PRECOMPRESS: '0'
          # VITE_AMBER stays unset: the amber exhibits (docs/LEGAL-REVIEW.md item 2) are not published
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
